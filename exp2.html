# Student Profile Generator — Colorful Webpage

```html
<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, lightblue, pink, lightgreen);
            min-height: 100vh;
            text-align: center;
            padding: 30px;
            margin: 0;
        }

        h1 {
            color: #234;
            margin-bottom: 25px;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.9);
            width: 350px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #9ad9e8;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #66bb6a;
        }

        button {
            padding: 12px 22px;
            margin-top: 12px;
            background-color: #66bb6a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #43a047;
        }

        #profile {
            width: 420px;
            max-width: 90%;
            margin: 30px auto;
        }

        .student-card {
            background: linear-gradient(135deg, #e3f2fd, #fce4ec, #e8f5e9);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            text-align: left;
            border-left: 6px solid #66bb6a;
        }

        .student-card h2 {
            text-align: center;
            color: #1976d2;
            margin-bottom: 20px;
        }

        .student-card p {
            font-size: 17px;
            margin: 14px 5px;
            color: #333;
        }

        .student-card p strong {
            color: #388e3c;
        }
    </style>
</head>

<body>

    <h1>🎓 Student Profile Generator</h1>

    <div class="form-container">

        <input type="text" id="name" placeholder="Enter Name">

        <input type="text" id="rollNo" placeholder="Enter Roll Number">

        <input type="text" id="department" placeholder="Enter Department">

        <input type="number" id="cgpa" placeholder="Enter CGPA" step="0.01">

        <br>

        <button id="createBtn">Create Student Profile</button>

    </div>

    <div id="profile"></div>

    <script>

        class Student {
            constructor(name, rollNo, department, cgpa) {
                this.name = name;
                this.rollNo = rollNo;
                this.department = department;
                this.cgpa = cgpa;
            }
        }

        document.getElementById("createBtn").addEventListener("click", function() {

            let name = document.getElementById("name").value;
            let rollNo = document.getElementById("rollNo").value;
            let department = document.getElementById("department").value;
            let cgpa = document.getElementById("cgpa").value;

            let student = new Student(name, rollNo, department, cgpa);

            let profile = document.getElementById("profile");

            profile.innerHTML = "";

            let card = document.createElement("div");
            card.className = "student-card";

            let heading = document.createElement("h2");
            heading.textContent = "Student Profile";

            let nameElement = document.createElement("p");
            nameElement.innerHTML = "<strong>Name:</strong> " + student.name;

            let rollElement = document.createElement("p");
            rollElement.innerHTML = "<strong>Roll No:</strong> " + student.rollNo;

            let departmentElement = document.createElement("p");
            departmentElement.innerHTML = "<strong>Department:</strong> " + student.department;

            let cgpaElement = document.createElement("p");
            cgpaElement.innerHTML = "<strong>CGPA:</strong> " + student.cgpa;

            card.appendChild(heading);
            card.appendChild(nameElement);
            card.appendChild(rollElement);
            card.appendChild(departmentElement);
            card.appendChild(cgpaElement);

            profile.appendChild(card);
        });

    </script>

</body>
</html>
